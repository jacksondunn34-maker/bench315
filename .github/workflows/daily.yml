name: Daily Garmin pull

on:
  schedule:
    - cron: "0 13 * * *"   # 8:00 AM US Central (CDT). Use "0 14 * * *" in winter (CST).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    env:
      GARMINTOKENS: /home/runner/.garminconnect
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore cached Garmin token
        uses: actions/cache@v4
        with:
          path: /home/runner/.garminconnect
          key: garmin-token-${{ github.run_id }}
          restore-keys: |
            garmin-token-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull today's Garmin data
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TOKEN_B64: ${{ secrets.GARMIN_TOKEN_B64 }}
        run: python update.py

      - name: Commit today's data
        run: |
          git config user.name "bench315-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/today.json
          git commit -m "Update readiness $(date -u +%F)" || echo "no changes"
          git push
